<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelime Kartları — Turkish Flashcards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:    #0f172a;
      --dark2:   #1e293b;
      --dark3:   #334155;
      --accent:  #e63946;
      --accent-dk:#c1121f;
      --cream:   #f8f4ef;
      --white:   #ffffff;
      --gray50:  #f9fafb;
      --gray100: #f3f4f6;
      --gray200: #e5e7eb;
      --gray400: #9ca3af;
      --gray600: #4b5563;
      --gray700: #374151;
      --gray900: #111827;
      --green:   #16a34a;
      --green-lt:#dcfce7;
      --amber:   #d97706;
      --amber-lt:#fef3c7;
      --blue:    #2563eb;
      --indigo:  #4f46e5;
      --shadow:  0 4px 24px rgba(0,0,0,.10);
      --radius:  16px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--gray900);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: var(--dark);
      color: #fff;
      padding: 20px 24px 0;
      box-shadow: 0 2px 16px rgba(0,0,0,.4);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }
    .header-top h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
    .header-top h1 span { display: block; font-size: .85rem; font-weight: 400; opacity: .55; }
    .flag { font-size: 2rem; }

    nav {
      display: flex;
      gap: 4px;
      max-width: 720px;
      margin: 16px auto 0;
    }
    nav button {
      background: transparent;
      border: none;
      color: rgba(255,255,255,.55);
      font-size: .95rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    nav button:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
    nav button.active { background: var(--cream); color: var(--dark); }

    /* ── Main ────────────────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .tab { display: none; }
    .tab.active { display: block; }

    /* ── Panel ───────────────────────────────────────── */
    .panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray700);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Form ────────────────────────────────────────── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .82rem; font-weight: 600; color: var(--gray600); letter-spacing: .03em; }
    .field input, .field textarea {
      border: 1.5px solid var(--gray200);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--gray900);
      transition: border-color .15s;
      background: var(--gray50);
    }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--dark2);
      background: var(--white);
    }
    .field.full { grid-column: 1 / -1; }
    .field textarea { resize: vertical; min-height: 60px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: none;
      border-radius: 10px;
      font-size: .93rem;
      font-weight: 600;
      font-family: inherit;
      padding: 11px 22px;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn:hover { filter: brightness(.9); }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--dark); color: #fff; }
    .btn-ghost   { background: var(--gray100); color: var(--gray700); }
    .btn-green   { background: var(--green);   color: #fff; }
    .btn-amber   { background: var(--amber);   color: #fff; }
    .btn-indigo  { background: var(--indigo);  color: #fff; }
    .btn-sm { padding: 6px 14px; font-size: .82rem; border-radius: 8px; }
    .btn-icon { padding: 8px; border-radius: 8px; background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--gray400); transition: color .15s, background .15s; }
    .btn-icon:hover { color: var(--accent); background: var(--gray100); }

    .form-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 16px; }
    .msg { font-size: .85rem; padding: 8px 14px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.success { background: var(--green-lt); color: var(--green); }
    .msg.error   { background: #fee2e2; color: var(--accent-dk); }

    /* ── Word List ───────────────────────────────────── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--gray50);
      border: 1.5px solid var(--gray200);
      border-radius: 10px;
      padding: 0 14px;
      margin-bottom: 16px;
    }
    .search-bar input {
      border: none;
      background: transparent;
      padding: 10px 0;
      font-size: .95rem;
      width: 100%;
      font-family: inherit;
    }
    .search-bar input:focus { outline: none; }
    .search-bar span { color: var(--gray400); }
    .word-count { font-size: .82rem; color: var(--gray400); margin-bottom: 14px; }

    .word-list { display: flex; flex-direction: column; gap: 8px; }
    .word-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gray50);
      border: 1.5px solid var(--gray200);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color .15s;
    }
    .word-item:hover { border-color: var(--gray400); }
    .word-item-main { flex: 1; min-width: 0; }
    .word-tr { font-size: 1rem; font-weight: 700; color: var(--gray900); display: flex; align-items: center; gap: 8px; }
    .word-en { font-size: .88rem; color: var(--gray600); margin-top: 2px; }
    .word-notes { font-size: .8rem; color: var(--gray400); font-style: italic; margin-top: 3px; }
    .word-stats { display: flex; gap: 8px; flex-shrink: 0; }
    .stat-pill {
      font-size: .75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .stat-correct   { background: var(--green-lt); color: var(--green); }
    .stat-incorrect { background: #fee2e2; color: var(--accent-dk); }
    .badge-new {
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .06em;
      padding: 2px 7px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      vertical-align: middle;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray400);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: .95rem; }

    /* ── Quiz mode toggle ────────────────────────────── */
    .quiz-mode-toggle {
      display: flex;
      background: var(--gray100);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .quiz-mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: .9rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--gray600);
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .quiz-mode-btn:hover { color: var(--gray900); }
    .quiz-mode-btn.active {
      background: var(--dark);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    .quiz-mode-btn .badge-count {
      background: rgba(255,255,255,.2);
      color: inherit;
      font-size: .72rem;
      padding: 1px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .quiz-mode-btn:not(.active) .badge-count {
      background: var(--gray200);
      color: var(--gray600);
    }

    /* ── Quiz settings ───────────────────────────────── */
    .quiz-settings {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .quiz-settings label { font-size: .85rem; font-weight: 600; color: var(--gray600); }
    .quiz-settings select {
      border: 1.5px solid var(--gray200);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: .88rem;
      font-family: inherit;
      background: var(--white);
      color: var(--gray900);
      cursor: pointer;
    }
    .quiz-settings select:focus { outline: none; border-color: var(--dark2); }

    /* ── Session bar ─────────────────────────────────── */
    .session-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .session-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--gray600);
    }
    .session-stat .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-dark   { background: var(--dark2); }
    .dot-green  { background: var(--green); }
    .dot-amber  { background: var(--amber); }
    .dot-indigo { background: var(--indigo); }

    /* ── Flip card ───────────────────────────────────── */
    .card-scene {
      perspective: 1000px;
      height: 280px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .card-flip {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.4,0,.2,1);
    }
    .card-flip.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .card-front { background: var(--white); border: 2px solid var(--gray200); }
    .card-back  { background: var(--dark);  transform: rotateY(180deg); color: #fff; }
    .card-label {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .45;
      margin-bottom: 12px;
    }
    .card-word {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .card-hint {
      font-size: .88rem;
      opacity: .55;
      font-style: italic;
    }
    .card-tap {
      font-size: .8rem;
      color: var(--gray400);
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .quiz-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .quiz-actions .btn { min-width: 140px; justify-content: center; font-size: 1rem; padding: 14px 28px; }

    /* ── Quiz done screen ────────────────────────────── */
    .quiz-done {
      text-align: center;
      padding: 32px 20px;
    }
    .quiz-done .big { font-size: 3.5rem; margin-bottom: 12px; }
    .quiz-done h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    .quiz-done p  { color: var(--gray600); margin-bottom: 20px; }
    .score-row { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
    .score-box { text-align: center; }
    .score-num { font-size: 2rem; font-weight: 800; line-height: 1; }
    .score-lbl { font-size: .8rem; color: var(--gray400); margin-top: 4px; font-weight: 600; }
    .score-green  { color: var(--green); }
    .score-amber  { color: var(--amber); }
    .score-indigo { color: var(--indigo); }

    .progress-bar-wrap {
      background: var(--gray200);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--dark2);
      border-radius: 99px;
      transition: width .3s;
    }
    .card-counter {
      text-align: center;
      font-size: .85rem;
      color: var(--gray400);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .quiz-no-words {
      text-align: center;
      padding: 48px 20px;
      color: var(--gray400);
    }
    .quiz-no-words .emoji { font-size: 3rem; margin-bottom: 12px; }

    /* learn-new empty */
    .learn-done-banner {
      text-align: center;
      padding: 36px 20px;
      background: var(--green-lt);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .learn-done-banner .big { font-size: 2.8rem; margin-bottom: 10px; }
    .learn-done-banner h2 { font-size: 1.25rem; font-weight: 800; color: var(--green); margin-bottom: 6px; }
    .learn-done-banner p { color: #166534; font-size: .9rem; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <span class="flag">🇹🇷</span>
    <h1>Учу Турецкий<span>Цель: 1500 слов </span></h1>
  </div>
  <nav>
    <button class="active" onclick="switchTab('words')">📖 Все слова</button>
    <button onclick="switchTab('quiz')">🎯 Тест</button>
  </nav>
</header>

<main>
  <!-- ══ MY WORDS TAB ══════════════════════════════════ -->
  <div id="tab-words" class="tab active">

    <div class="panel">
      <div class="panel-title">➕Новое слово
      </div>
      <form id="add-form" onsubmit="addWord(event)">
        <div class="form-row">
          <div class="field">
            <label>СЛОВО</label>
            <input id="inp-tr" type="text" placeholder="e.g. merhaba" autocomplete="off" required />
          </div>
          <div class="field">
            <label>ПЕРЕВОД</label>
            <input id="inp-en" type="text" placeholder="e.g. привет" autocomplete="off" required />
          </div>
          <div class="field full">
            <label>Заметка (примеры, когда используется, контекст)</label>
            <textarea id="inp-notes" placeholder="e.g. informal greeting used any time of day"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <div id="add-msg" class="msg"></div>
          <button type="submit" class="btn btn-primary">Добавить слово</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-title">📚 Все слова</div>
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="search-inp" placeholder="Search words…" oninput="renderWordList()" />
      </div>
      <div id="word-count" class="word-count"></div>
      <div id="word-list" class="word-list"></div>
    </div>

  </div>

  <!-- ══ QUIZ TAB ══════════════════════════════════════ -->
  <div id="tab-quiz" class="tab">

    <div id="quiz-no-words" class="panel quiz-no-words" style="display:none">
      <div class="emoji">📝</div>
      <p>Сначала добавьте слова, затем возвращайтесь!</p>
    </div>

    <div id="quiz-area" style="display:none">
      <div class="panel">

        <!-- Mode toggle -->
        <div class="quiz-mode-toggle">
          <button class="quiz-mode-btn active" id="mode-btn-learn" onclick="setQuizMode('learn')">
            🌱 Новые слова <span id="badge-new-count" class="badge-count">0</span>
          </button>
          <button class="quiz-mode-btn" id="mode-btn-repeat" onclick="setQuizMode('repeat')">
            🔁 Повторить все <span id="badge-all-count" class="badge-count">0</span>
          </button>
        </div>

        <!-- Settings row -->
        <div class="quiz-settings">
          <label>Направление:</label>
          <select id="quiz-dir" onchange="startQuiz()">
            <option value="tr-en">Турецкий → Русский</option>
            <option value="en-tr">Русский → Турецкий</option>
            <option value="random">Рандом</option>
          </select>
          <label style="margin-left:8px" id="order-label">Порядок:</label>
          <select id="quiz-order" onchange="startQuiz()">
            <option value="random">Рандом</option>
            <option value="worst">Сложные первые</option>
            <option value="newest">Новые первые</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="startQuiz()" style="margin-left:auto">↺ Заново</button>
        </div>

        <!-- Session stats -->
        <div class="session-bar">
          <div class="session-stat"><div class="dot dot-dark"></div><span id="stat-total">0 слов</span></div>
          <div class="session-stat"><div class="dot dot-green"></div><span id="stat-correct">0 верно</span></div>
        </div>

        <!-- Progress -->
        <div class="progress-bar-wrap">
          <div id="progress-fill" class="progress-bar-fill" style="width:0%"></div>
        </div>
        <div id="card-counter" class="card-counter"></div>

        <!-- Card -->
        <div id="quiz-card-wrap"></div>

        <!-- Action buttons (injected per mode) -->
        <div id="quiz-actions" class="quiz-actions" style="display:none"></div>

        <!-- Done screen -->
        <div id="quiz-done" class="quiz-done" style="display:none">
          <div class="big">🎉</div>
          <h2 id="done-title">Раунд завершён!</h2>
          <p id="done-sub">Вот ваши результаты:</p>
          <div class="score-row">
            <div class="score-box">
              <div id="done-correct" class="score-num score-green">0</div>
              <div class="score-lbl" id="done-correct-lbl">ВЕРНО</div>
            </div>
            <div class="score-box" id="done-promoted-box" style="display:none">
              <div id="done-promoted" class="score-num score-indigo">0</div>
              <div class="score-lbl">ВЫУЧЕНО</div>
            </div>
            <div class="score-box">
              <div id="done-total" class="score-num">0</div>
              <div class="score-lbl">ВСЕГО</div>
            </div>
            <div class="score-box">
              <div id="done-pct" class="score-num score-amber">0%</div>
              <div class="score-lbl">РЕЗУЛЬТАТ</div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="startQuiz()">Ещё раз</button>
        </div>

      </div>
    </div>
  </div>
</main>

<script>
// ── Storage ────────────────────────────────────────────
const STORE_KEY = 'kelime_kartlari_v2';

function loadWords() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}

function saveWords(words) {
  localStorage.setItem(STORE_KEY, JSON.stringify(words));
}

// Migrate old v1 data if present
(function migrate() {
  const old = localStorage.getItem('kelime_kartlari_v1');
  if (old && !localStorage.getItem(STORE_KEY)) {
    try {
      const words = JSON.parse(old).map(w => ({ ...w, status: 'learned' }));
      saveWords(words);
    } catch {}
  }
})();

// ── Tabs ───────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('nav button')[name === 'words' ? 0 : 1].classList.add('active');
  if (name === 'quiz') initQuiz();
}

// ── Add Word ───────────────────────────────────────────
function addWord(e) {
  e.preventDefault();
  const tr    = document.getElementById('inp-tr').value.trim();
  const en    = document.getElementById('inp-en').value.trim();
  const notes = document.getElementById('inp-notes').value.trim();

  const words = loadWords();
  if (words.some(w => w.tr.toLowerCase() === tr.toLowerCase())) {
    showMsg('add-msg', 'Такое слово уже есть!', 'error');
    return;
  }

  words.push({
    id: Date.now().toString(),
    tr, en, notes,
    addedAt: Date.now(),
    status: 'new',
    correct: 0,
    incorrect: 0
  });
  saveWords(words);

  document.getElementById('inp-tr').value = '';
  document.getElementById('inp-en').value = '';
  document.getElementById('inp-notes').value = '';
  document.getElementById('inp-tr').focus();
  showMsg('add-msg', `«${tr}» добавлено!`, 'success');
  renderWordList();
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Word List ──────────────────────────────────────────
function renderWordList() {
  const words  = loadWords();
  const query  = document.getElementById('search-inp').value.trim().toLowerCase();
  const filtered = query
    ? words.filter(w =>
        w.tr.toLowerCase().includes(query) ||
        w.en.toLowerCase().includes(query) ||
        (w.notes||'').toLowerCase().includes(query))
    : words;

  const newCount     = words.filter(w => (w.status||'new') === 'new').length;
  const learnedCount = words.length - newCount;
  document.getElementById('word-count').innerHTML =
    `${words.length} ${words.length === 1 ? 'слово' : words.length < 5 ? 'слова' : 'слов'} всего` +
    (newCount > 0 ? ` &nbsp;·&nbsp; <span style="color:#1d4ed8;font-weight:700">${newCount} новых</span>` : '') +
    (learnedCount > 0 ? ` &nbsp;·&nbsp; <span style="color:var(--green);font-weight:700">${learnedCount} выучено</span>` : '');

  const listEl = document.getElementById('word-list');

  if (filtered.length === 0) {
    listEl.innerHTML = words.length === 0
      ? `<div class="empty-state"><div class="emoji">🌱</div><p>Слов пока нет — добавьте первое!</p></div>`
      : `<div class="empty-state"><div class="emoji">🔍</div><p>Ничего не найдено.</p></div>`;
    return;
  }

  listEl.innerHTML = filtered.slice().reverse().map(w => {
    const isNew = (w.status || 'new') === 'new';
    const total = w.correct + w.incorrect;
    const statsHtml = total > 0
      ? `<div class="word-stats">
           <span class="stat-pill stat-correct">✓ ${w.correct}</span>
           <span class="stat-pill stat-incorrect">✗ ${w.incorrect}</span>
         </div>`
      : '';
    return `
      <div class="word-item" id="wi-${w.id}">
        <div class="word-item-main">
          <div class="word-tr">
            ${escHtml(w.tr)}
            ${isNew ? '<span class="badge-new">НОВОЕ</span>' : ''}
          </div>
          <div class="word-en">${escHtml(w.en)}</div>
          ${w.notes ? `<div class="word-notes">${escHtml(w.notes)}</div>` : ''}
        </div>
        ${statsHtml}
        <button class="btn-icon" title="Delete" onclick="deleteWord('${w.id}')">🗑️</button>
      </div>`;
  }).join('');
}

function deleteWord(id) {
  saveWords(loadWords().filter(w => w.id !== id));
  renderWordList();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Quiz State ─────────────────────────────────────────
let quizMode = 'learn';   // 'learn' | 'repeat'
let deck = [];
let deckIdx = 0;
let sessionCorrect = 0;
let sessionIncorrect = 0;
let sessionPromoted = 0;
let cardFlipped = false;

// ── Quiz Init ──────────────────────────────────────────
function initQuiz() {
  const words = loadWords();
  const noWrap  = document.getElementById('quiz-no-words');
  const quizArea = document.getElementById('quiz-area');
  if (words.length === 0) {
    noWrap.style.display = '';
    quizArea.style.display = 'none';
  } else {
    noWrap.style.display = 'none';
    quizArea.style.display = '';
    updateModeBadges();
    startQuiz();
  }
}

function updateModeBadges() {
  const words = loadWords();
  const newCount = words.filter(w => (w.status||'new') === 'new').length;
  document.getElementById('badge-new-count').textContent = newCount;
  document.getElementById('badge-all-count').textContent = words.length;
}

function setQuizMode(mode) {
  quizMode = mode;
  document.getElementById('mode-btn-learn').classList.toggle('active', mode === 'learn');
  document.getElementById('mode-btn-repeat').classList.toggle('active', mode === 'repeat');
  startQuiz();
}

// ── Build deck ─────────────────────────────────────────
function buildDeck(words) {
  const order = document.getElementById('quiz-order').value;
  let list = [...words];
  if (order === 'random') {
    list.sort(() => Math.random() - .5);
  } else if (order === 'worst') {
    list.sort((a, b) => {
      const rA = a.correct + a.incorrect === 0 ? -1 : a.correct / (a.correct + a.incorrect);
      const rB = b.correct + b.incorrect === 0 ? -1 : b.correct / (b.correct + b.incorrect);
      return rA - rB;
    });
  } else if (order === 'newest') {
    list.sort((a, b) => b.addedAt - a.addedAt);
  }
  return list;
}

// ── Start Quiz ─────────────────────────────────────────
function startQuiz() {
  updateModeBadges();
  const allWords = loadWords();

  const pool = quizMode === 'learn'
    ? allWords.filter(w => (w.status || 'new') === 'new')
    : allWords;

  // Show "no new words" banner if learn mode has nothing
  if (pool.length === 0 && quizMode === 'learn') {
    document.getElementById('quiz-card-wrap').innerHTML =
      `<div class="learn-done-banner">
        <div class="big">✅</div>
        <h2>Всё выучено!</h2>
        <p>Вы выучили все новые слова. Добавьте новые или переходите в «Повторить все».</p>
      </div>`;
    document.getElementById('quiz-actions').style.display = 'none';
    document.getElementById('quiz-done').style.display = 'none';
    document.getElementById('card-counter').textContent = '';
    document.getElementById('progress-fill').style.width = '0%';
    resetSessionBar();
    return;
  }

  deck = buildDeck(pool);
  deckIdx = 0;
  sessionCorrect = 0;
  sessionIncorrect = 0;
  sessionPromoted = 0;

  document.getElementById('quiz-done').style.display = 'none';
  document.getElementById('quiz-actions').style.display = 'none';

  updateSessionBar();
  showCard();
}

function resetSessionBar() {
  document.getElementById('stat-total').textContent  = '0 слов';
  document.getElementById('stat-correct').textContent = '0 верно';
}

// ── Show card ──────────────────────────────────────────
function showCard() {
  if (deckIdx >= deck.length) {
    endQuiz();
    return;
  }
  cardFlipped = false;
  const word = deck[deckIdx];
  const dir  = document.getElementById('quiz-dir').value;
  const showTr = dir === 'tr-en' || (dir === 'random' && Math.random() > .5);
  word._showTr = showTr;

  const front    = showTr ? word.tr : word.en;
  const back     = showTr ? word.en : word.tr;
  const frontLbl = showTr ? '🇹🇷 Turkish' : '🇷🇺 Russian';
  const backLbl  = showTr ? '🇷🇺 Russian' : '🇹🇷 Turkish';

  document.getElementById('quiz-card-wrap').innerHTML = `
    <div class="card-scene" onclick="flipCard()">
      <div class="card-flip" id="flip-card">
        <div class="card-face card-front">
          <div class="card-label">${frontLbl}</div>
          <div class="card-word">${escHtml(front)}</div>
          ${word.notes && showTr ? `<div class="card-hint">${escHtml(word.notes)}</div>` : ''}
          <div class="card-tap"><span>👆</span> перевод</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">${backLbl}</div>
          <div class="card-word">${escHtml(back)}</div>
          ${word.notes && !showTr ? `<div class="card-hint">${escHtml(word.notes)}</div>` : ''}
        </div>
      </div>
    </div>`;

  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('card-counter').textContent = `Карточка ${deckIdx + 1} из ${deck.length}`;
  document.getElementById('progress-fill').style.width = (deckIdx / deck.length * 100) + '%';
}

function flipCard() {
  if (cardFlipped) return;
  cardFlipped = true;
  document.getElementById('flip-card').classList.add('flipped');
  setTimeout(() => renderActionButtons(), 300);
}

function renderActionButtons() {
  const actEl = document.getElementById('quiz-actions');
  if (quizMode === 'learn') {
    actEl.innerHTML = `
      <button class="btn btn-amber" onclick="markCard(false, false)">😓 Ещё учу</button>
      <button class="btn btn-indigo" onclick="markCard(true, true)">🎓 Выучил!</button>`;
  } else {
    actEl.innerHTML = `
      <button class="btn btn-amber" onclick="markCard(false, false)">😓 Не знаю</button>
      <button class="btn btn-green" onclick="markCard(true, false)">✓ Знаю!</button>`;
  }
  actEl.style.display = 'flex';
}

// ── Mark card ──────────────────────────────────────────
function markCard(correct, promote) {
  const words = loadWords();
  const word  = deck[deckIdx];
  const idx   = words.findIndex(w => w.id === word.id);
  if (idx !== -1) {
    if (correct) words[idx].correct++;
    else         words[idx].incorrect++;
    if (promote) words[idx].status = 'learned';
    if (!correct && quizMode === 'repeat') words[idx].status = 'new';
    saveWords(words);
  }

  if (correct) sessionCorrect++;
  else         sessionIncorrect++;
  if (promote) sessionPromoted++;

  deckIdx++;
  updateSessionBar();
  showCard();
}

function updateSessionBar() {
  document.getElementById('stat-total').textContent   = `${deck.length} слов`;
  document.getElementById('stat-correct').textContent = `${sessionCorrect} верно`;
}

// ── End quiz ───────────────────────────────────────────
function endQuiz() {
  document.getElementById('quiz-card-wrap').innerHTML = '';
  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('card-counter').textContent = '';
  document.getElementById('progress-fill').style.width = '100%';

  const total = sessionCorrect + sessionIncorrect;
  const pct   = total === 0 ? 0 : Math.round((sessionCorrect / total) * 100);

  document.getElementById('done-correct').textContent = sessionCorrect;
  document.getElementById('done-total').textContent   = total;
  document.getElementById('done-pct').textContent     = pct + '%';

  if (quizMode === 'learn') {
    document.getElementById('done-title').textContent = 'Сессия завершена!';
    document.getElementById('done-sub').textContent   = `Вы перенесли ${sessionPromoted} сл. в коллекцию.`;
    document.getElementById('done-correct-lbl').textContent = 'ВЕРНО';
    document.getElementById('done-promoted').textContent = sessionPromoted;
    document.getElementById('done-promoted-box').style.display = '';
  } else {
    document.getElementById('done-title').textContent = 'Раунд завершён!';
    const movedBack = sessionIncorrect;
    document.getElementById('done-sub').textContent   =
      movedBack > 0
        ? `${movedBack} сл. возвращено в «Новые слова».`
        : 'Отлично — ни одного слова не возвращено!';
    document.getElementById('done-correct-lbl').textContent = 'ВЕРНО';
    document.getElementById('done-promoted-box').style.display = 'none';
  }

  document.getElementById('quiz-done').style.display = '';
  updateModeBadges();
}

// ── Boot ───────────────────────────────────────────────
renderWordList();
</script>
</body>
